<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a1f" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <link rel="icon" type="image/png" href="%BASE_URL%icon-192.png" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <title>We Tanks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a1a1f;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #game { width: 100%; height: 100%; }
    canvas { display: block; }

    /* El juego es horizontal: en vertical pedimos girar el movil */
    #rotate {
      display: none;
      position: fixed; inset: 0; z-index: 10;
      background: #1a1a1f; color: #e8e8ef;
      font-family: monospace; text-align: center;
      align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    }
    #rotate .phone {
      width: 74px; height: 120px; border: 4px solid #3f8fdf; border-radius: 12px;
      animation: turn 1.8s ease-in-out infinite;
    }
    @keyframes turn {
      0%, 40% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">
    <div class="phone"></div>
    <p style="font-size: 20px">Gira el móvil</p>
    <p style="font-size: 14px; color: #9a9aa8">We Tanks se juega en horizontal</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
